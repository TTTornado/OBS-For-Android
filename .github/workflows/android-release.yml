name: Android pre-release

# tag 触发（`v33.0.1-pre1` 这类）：复用 android-compile.yml 出包，再把 APK 挂到
# GitHub Release 上，标成 pre-release。
#
# 为什么单独一个文件、而不是在 android-compile.yml 里加一个 job：
# 那边的 push 触发器带 `paths` 过滤，而 paths 对 tag push 的匹配规则容易出意外
# —— tag 指向的提交若没改到白名单里的路径，整条流水线根本不会启动，
# 表现是"打了 tag、什么都没发生"。独立文件只按 tag 触发，不受 paths 影响。
#
# 签名：tag 构建应使用固定的 release keystore，否则每个版本都是"另一个应用"、
# 用户无法覆盖安装。在仓库/组织 Secrets 配置：
#   RELEASE_KEYSTORE_B64  keystore 文件的 base64 编码内容
#   RELEASE_KS_ALIAS      密钥别名
#   RELEASE_KS_PASS       keystore 库密码
#   RELEASE_KEY_PASS      密钥密码
# 下面用 secrets: inherit 把它们传给被调用的 android-compile.yml，由它在
# build job 里解码成文件、再通过环境变量交给 android/build-apk.sh。
# 未配置时被调用 workflow 会回退到临时 debug 密钥（能构建，但禁止用于正式发布）。

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 复用主 workflow：依赖编译、编译验证、打 APK 三步都在那边，这里不重复写。
    permissions:
      contents: read
    uses: ./.github/workflows/android-compile.yml
    # workflow_call 默认**不继承** secrets：不写这一行，被调用 workflow 拿不到
    # 任何 secret，release keystore 也就传不进去。等价写法是显式列出 secrets 映射。
    secrets: inherit

  release:
    name: 发布 pre-release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: OBS-Android-apk
          path: dist

      - name: 生成 sha256
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum ./*.apk | tee SHA256SUMS.txt

      - name: 创建 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            dist/*.apk dist/SHA256SUMS.txt
