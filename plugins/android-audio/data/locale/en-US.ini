Name="AAudio Input (Android Microphone)"
DeviceId="Audio Input Device"
DefaultInput.BusNotConnected="System default input (audio bus not connected: host app did not register obs_android_set_audio_host)"
DefaultInput.SnapshotFailed="System default input (bus connected but the host snapshot could not be parsed: protocol mismatch)"
DefaultInput.NoDevices="System default input (no audio input devices found; the list may be empty without RECORD_AUDIO)"
DefaultInput.System="System default input (chosen by AAudio)"
SampleRate="Requested sample rate (Hz, 0 = let the system decide)"
Channels="Requested channel count (1 or 2)"
InputPreset="Input Preset"
InputPreset.Generic="generic (general purpose)"
InputPreset.Camcorder="camcorder (with AGC / noise suppression)"
InputPreset.VoiceRecognition="voice_recognition (as unprocessed as possible)"
InputPreset.VoiceCommunication="voice_communication (with echo cancellation)"
InputPreset.Unprocessed="unprocessed (no processing)"
SharingMode="Sharing Mode"
SharingMode.Shared="shared (mixed by AudioFlinger; sample rate / format may be changed by the system)"
SharingMode.Exclusive="exclusive (lowest latency; only one client per device)"
PerformanceMode="Performance Mode"
PerformanceMode.None="none (no special requirement)"
PerformanceMode.LowLatency="low_latency (prefer low latency; check the readback for what was actually granted)"
PerformanceMode.PowerSaving="power_saving (power saving; the header states input streams do not support it, so it is treated as none)"
MmapPolicy="MMAP Path (API 36+ only; this plugin decides availability via dlsym)"
MmapPolicy.Unspecified="unspecified (leave this switch alone, use the system default)"
MmapPolicy.Never="never (force the legacy path)"
MmapPolicy.Auto="auto (use MMAP when available, otherwise fall back)"
MmapPolicy.Always="always (require MMAP, otherwise stream creation fails)"
